<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="wrap">
        <header>
            <h1><a href="#">ododog</a></h1>
            <ul class="nav">
                <li><a href="#">profile</a></li>
                <li><a href="#">portfolio</a></li>
                <li><a href="#">contact</a></li>
            </ul>
        </header>
        <main>
            <h2>안녕하세요~</h2>

            <!--video box start -->
            <div class="video-box">
                <video autoplay loop muted playsinline>
                    <source src="img/trees.mp4" type="video/mp4">
                    <p>브라우저에서 비디오를 지원하지 않습니다.</p>
                </video>
            </div>
            <!--video box end -->


            <!--proflie box start -->
            <div class="profile-box">
                <div id="card">
                    <img src="img/img_profile1.jpg" alt="프로필 이미지">
                    <h1>Mr.damgom</h1>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod ut labore et dolore magna
                        aliqua.</p>
                    <a href="http://google.com" target="_blank">pick me!!</a>
                </div>
            </div>
            <!--profile box end -->

            <!--portfolio box start -->
            <div class="portfolio-box">
                <ul class="photo-list">
                    <li><a href="#modal1"><img src="img/img_photo_1.jpg" alt="생선"></a></li>
                    <li><a href="#modal2"><img src="img/img_photo_2.jpg" alt="국수"></a></li>
                    <li><a href="#modal3"><img src="img/img_photo_3.jpg" alt="매운"></a></li>
                </ul>
                <div id="modal1" class="modal">
                    <div class="modal-content">
                        <a href="#" class="close-btn">&times;</a>
                        <img src="img/img_photo_1.jpg" alt="생선 큰 이미지">
                    </div>
                </div>
                <div id="modal2" class="modal">
                    <div class="modal-content">
                        <a href="#" class="close-btn">&times;</a>
                        <img src="img/img_photo_2.jpg" alt="국수 큰 이미지">
                    </div>
                </div>
                <div id="modal3" class="modal">
                    <div class="modal-content">
                        <a href="#" class="close-btn">&times;</a>
                        <img src="img/img_photo_3.jpg" alt="매운 큰 이미지">
                    </div>
                </div>
            </div>
            <!--portfolio box end -->

            <!--slide box start -->
            <div class="slide-box">
                <ul>
                    <li><img src="img/img_photo_1.jpg" alt="생선"></li>
                    <li><img src="img/img_photo_2.jpg" alt="국수"></li>
                    <li><img src="img/img_photo_3.jpg" alt="매운"></li>
                </ul>
            </div>
            <!--slide box end -->



        </main>
        <footer>
            <p>&copy;ododog 2026.</p>
            <ul>
                <li><a href="#">insta</a></li>
                <li><a href="#">behance</a></li>
            </ul>
        </footer>
    </div>
</body>

</html>
