<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Only Multi-Filter Gallery (4x3)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="title">Photo Gallery</h1>
      <p class="subtitle">자바스크립트 없이 순수 CSS로 구현된 다중 선택 필터 갤러리</p>
      <div class="filter-hint">
        <span class="hint-badge">Tip</span> 원하는 카테고리를 여러 개 클릭하여 동시 선택할 수 있습니다.
      </div>
    </header>

    <!-- CSS 다중선택 체크박스 (화면 숨김) -->
    <input type="checkbox" name="filter" id="chk-nature" class="filter-checkbox">
    <input type="checkbox" name="filter" id="chk-city" class="filter-checkbox">
    <input type="checkbox" name="filter" id="chk-animal" class="filter-checkbox">

    <!-- 다중 선택 필터 버튼 (label) -->
    <div class="filter-nav">
      <label for="chk-nature" class="filter-btn btn-nature">
        <span class="btn-check"></span>자연
      </label>
      <label for="chk-city" class="filter-btn btn-city">
        <span class="btn-check"></span>도시
      </label>
      <label for="chk-animal" class="filter-btn btn-animal">
        <span class="btn-check"></span>동물
      </label>
    </div>

    <!-- 4 * 3 갤러리 그리드 (총 12개 아이템) -->
    <main class="gallery-grid">
      <!-- 자연 (Nature) 4개 -->
      <article class="gallery-item nature">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=700&q=80" alt="에메랄드빛 호수와 협곡" loading="lazy">
          <div class="overlay">
            <span class="badge">자연</span>
            <h3>요세미티 계곡 호수</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item nature">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=700&q=80" alt="안개 낀 울창한 산림" loading="lazy">
          <div class="overlay">
            <span class="badge">자연</span>
            <h3>신비로운 아침 안개숲</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item nature">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=700&q=80" alt="웅장한 산맥과 계곡" loading="lazy">
          <div class="overlay">
            <span class="badge">자연</span>
            <h3>만년설과 초원</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item nature">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=700&q=80" alt="황금빛 노을이 지는 들판" loading="lazy">
          <div class="overlay">
            <span class="badge">자연</span>
            <h3>황혼의 언덕</h3>
          </div>
        </div>
      </article>

      <!-- 도시 (City) 4개 (검증 완료된 고화질 URL) -->
      <article class="gallery-item city">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=700&q=80" alt="도시의 화려한 야경" loading="lazy">
          <div class="overlay">
            <span class="badge">도시</span>
            <h3>도심의 마천루 야경</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item city">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=700&q=80" alt="현대적인 고층 건축물" loading="lazy">
          <div class="overlay">
            <span class="badge">도시</span>
            <h3>기하학적 건축 미학</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item city">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=700&q=80" alt="네온사인이 빛나는 밤거리" loading="lazy">
          <div class="overlay">
            <span class="badge">도시</span>
            <h3>네온사인 거리 풍경</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item city">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=700&q=80" alt="끝없이 펼쳐진 도시 스카이라인" loading="lazy">
          <div class="overlay">
            <span class="badge">도시</span>
            <h3>메트로폴리스의 정경</h3>
          </div>
        </div>
      </article>

      <!-- 동물 (Animal) 4개 (검증 완료된 고화질 URL) -->
      <article class="gallery-item animal">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=700&q=80" alt="위엄 있는 사자의 클로즈업" loading="lazy">
          <div class="overlay">
            <span class="badge">동물</span>
            <h3>초원의 왕 사자</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item animal">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=700&q=80" alt="눈밭 속의 붉은 여우" loading="lazy">
          <div class="overlay">
            <span class="badge">동물</span>
            <h3>설원의 붉은 여우</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item animal">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=700&q=80" alt="귀여운 골든 리트리버" loading="lazy">
          <div class="overlay">
            <span class="badge">동물</span>
            <h3>다정한 골든 리트리버</h3>
          </div>
        </div>
      </article>

      <article class="gallery-item animal">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?auto=format&fit=crop&w=700&q=80" alt="대나무 잎을 먹는 자이언트 판다" loading="lazy">
          <div class="overlay">
            <span class="badge">동물</span>
            <h3>평화로운 판다</h3>
          </div>
        </div>
      </article>
    </main>
  </div>

</body>
</html>
